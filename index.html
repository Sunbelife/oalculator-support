<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Oalculator 支持</title>
  <meta name="description" content="Oalculator 官方支持与隐私信息">
  <style>
    :root { color-scheme: light dark; --paper:#f8f4ec; --ink:#28231f; --muted:#756b63; --accent:#c65f3a; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--paper); color:var(--ink); }
    main { width:min(720px,calc(100% - 40px)); margin:0 auto; padding:80px 0; }
    .mark { width:64px; height:64px; display:grid; place-items:center; border:1px solid #d7cec4; border-radius:18px; font:38px Georgia,serif; }
    h1 { margin:24px 0 8px; font:42px Georgia,"Times New Roman",serif; }
    h2 { margin-top:42px; font-size:20px; }
    p { line-height:1.75; color:var(--muted); }
    a { color:var(--accent); }
    .card { margin-top:28px; padding:24px; border:1px solid #d7cec4; border-radius:20px; background:color-mix(in srgb,var(--paper) 82%,white); }
    footer { margin-top:56px; font-size:13px; color:var(--muted); }
    @media (prefers-color-scheme:dark) { :root { --paper:#181614; --ink:#f4ede5; --muted:#b8ada4; --accent:#e48762; } .mark,.card { border-color:#443d37; } }
  </style>
</head>
<body>
  <main>
    <div class="mark">O</div>
    <h1>Oalculator</h1>
    <p>一款兼具日常计算与本地私密相册功能的 iPhone、iPad 应用。</p>

    <section class="card">
      <h2>使用提示</h2>
      <p>首次打开时设置 6 位密码。在计算器中输入密码并长按等号，即可进入私密相册。照片、视频和相册分类均保存在设备本地。</p>
    </section>

    <h2>联系支持</h2>
    <p>发送邮件至 <a href="mailto:Sunbelife@foxmail.com?subject=Oalculator%20Support">Sunbelife@foxmail.com</a>，请附上设备型号、系统版本与问题描述。</p>

    <h2>隐私</h2>
    <p>查看 <a href="privacy.html">Oalculator 隐私政策 / Privacy Policy</a>。</p>

    <footer>© 2026 Sunbelife</footer>
  </main>
</body>
</html>
